name: MIGRATE CLEAN SNAPSHOT

on:
  push:
    paths:
      - '.github/workflows/migrate-clean.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout current good source
        uses: actions/checkout@v4
        with:
          repository: SkyareCom/gemeo.stackup.holdem-heroes
          ref: main
          path: source
          persist-credentials: false

      - name: Copy only current working snapshot
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.deploy-trigger' \
            --exclude='.deploy-trigger-*' \
            --exclude='source/' \
            source/ ./
          rm -rf source
          sed -i 's/const repo = "gemeo.stackup.holdem-heroes";/const repo = "gemeo.stackup.holdem-heroes-clean";/' next.config.mjs
          rm -f .github/workflows/migrate-clean.yml

      - name: Commit clean snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SkyareCom"
          git config user.email "skyare.company@gmail.com"
          git add -A
          git commit -m "chore: migrate clean current snapshot"
          git push origin HEAD:main
